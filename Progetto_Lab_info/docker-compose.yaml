services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8003:8003"
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - API_BASE=http://backend:8003
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge